name: Set up SBT
description: Install SBT and optionally restore compiled output from this workflow run
inputs:
  artifact-id:
    description: Compiled output artifact to restore
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/coursier
          ~/.sbt
          ~/.ivy2/cache
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/**', '.github/actions/setup-sbt/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
    - uses: coursier/setup-action@v1
      with:
        jvm: zulu:17
        apps: sbt
    - uses: actions/download-artifact@v4
      if: inputs.artifact-id != ''
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/sbt-compiled
        merge-multiple: true
    - name: Restore compiled output
      if: inputs.artifact-id != ''
      shell: bash
      run: tar -xzf "$RUNNER_TEMP/sbt-compiled/sbt-compiled.tar.gz"
