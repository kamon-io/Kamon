name: Set up Mill
description: Set up the JDK and dependency cache, optionally restoring compiled Mill output.
inputs:
  artifact-id:
    description: Compiled output artifact to restore; omit when compiling from source.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch git tags
      shell: bash
      run: git fetch -f --depth=1 origin '+refs/tags/*:refs/tags/*'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: "zulu"
        java-version: "21"

    - name: Cache Mill and Coursier
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/mill
          ~/.cache/coursier
        key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '**/*.mill') }}
        restore-keys: |
          ${{ runner.os }}-mill-

    - name: Download compiled output
      if: inputs.artifact-id != ''
      uses: actions/download-artifact@v8.0.2
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        path: ${{ runner.temp }}/mill-compiled

    - name: Restore compiled output
      if: inputs.artifact-id != ''
      shell: bash
      run: tar -xzf "$RUNNER_TEMP/mill-compiled/mill-compiled.tar.gz"

