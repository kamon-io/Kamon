name: Test all the things

on:
  pull_request:
  push:
    branches:
      - master

env:
  JAVA_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
  JVM_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

jobs:
  compile:
    name: Compile everything
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.compiled.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-sbt
      - name: Check formatting
        run: sbt -v "+scalafmtCheckAll;scalafmtSbtCheck"
      - name: Compile all production and test configurations
        run: sbt -v ciCompile
      - name: Archive compiled output
        # Include Zinc analysis, managed sources, resources, and the compiled build definition.
        run: |
          find . -type d -name target -prune -print0 |
            tar --null -T - -czf "$RUNNER_TEMP/sbt-compiled.tar.gz"
      - name: Upload compiled output
        id: compiled
        uses: actions/upload-artifact@v4
        with:
          name: sbt-compiled-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sbt-compiled.tar.gz
          if-no-files-found: error
          compression-level: 0

  core:
    name: Run core tests
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-sbt
        with:
          artifact-id: ${{ needs.compile.outputs.artifact-id }}
      - name: Test core modules
        run: sbt -v "+core/test"

  instrumentation:
    name: Run ${{ matrix.group }} tests
    needs: [compile, core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Akka
            project: ciAkka
          - group: Pekko
            project: ciPekko
          - group: Play
            project: ciPlay
          - group: other instrumentation
            project: ciOther
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-sbt
        with:
          artifact-id: ${{ needs.compile.outputs.artifact-id }}
      - name: Test instrumentation group
        run: sbt -v "+${{ matrix.project }}/test"

  reporters:
    name: Run reporter tests
    needs: [compile, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-sbt
        with:
          artifact-id: ${{ needs.compile.outputs.artifact-id }}
      - name: Test reporters
        run: sbt -v "+reporters/test"

  bundle:
    name: Verify release packaging
    needs: [compile, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-sbt
        with:
          artifact-id: ${{ needs.compile.outputs.artifact-id }}
      - name: Generate release artifacts without publishing
        run: sbt -v "+bundle/packageBin;+packageBin;+packageSrc;+makePom"
