name: CI

'on':
  pull_request:
  push:
    branches:
      - master

env:
  JAVA_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
  JVM_OPTS: -Xms5120M -Xmx5120M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8

jobs:
  ci:
    name: Compile & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git tags
        run: git fetch -f --depth=1 origin '+refs/tags/*:refs/tags/*'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Mill and Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '**/*.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Verify build loading
        run: ./mill --no-daemon version

      - name: Compile all modules
        run: ./mill --no-daemon '__.compile'

      - name: Test core modules
        run: ./mill --no-daemon 'core.__.test'

      - name: Test reporters
        run: ./mill --no-daemon 'reporters.__.test'

      - name: Test instrumentation
        run: ./mill --no-daemon 'instrumentation.__.test'
